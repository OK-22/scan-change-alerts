name: scheduled-scan

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      demo_port:
        description: "Open a temporary listener on port 8099 to demonstrate detection"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Run unit tests
        run: pip install pytest && pytest -q

      - name: Start demo listener
        if: ${{ inputs.demo_port }}
        run: |
          nohup python -m http.server 8099 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2

      - name: Run scan
        id: scan
        run: python scan.py --targets targets.txt --baseline baseline.json --update-baseline

      - name: Open an issue when a new exposure appears
        if: steps.scan.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "New open port detected $(date -u +%F)" --body-file results/report.md

      - name: Save the updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git diff --cached --quiet || (git commit -m "Update scan baseline" && git push)

      - uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
